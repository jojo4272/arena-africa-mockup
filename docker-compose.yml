version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena_postgres
    environment:
      POSTGRES_USER: sysera
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: arena_predictions
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysera -d arena_predictions"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
